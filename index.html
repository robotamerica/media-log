<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>media log</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>">
<script>
(function () {
  const p = new URLSearchParams(window.location.search);
  const t = (p.get("theme") || "").toLowerCase();
  if (t === "dark" || t === "light") {
    document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem("media-log-theme", t);
  }
})();
</script>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand">
        <h1>media log</h1>
        <p class="desc">a small noncomprehensive almost daily ledger of the media i consumed.</p>
        <div class="controls" role="group" aria-label="filters">
          <button id="modeLatest" class="btn is-on" type="button">latest</button>
          <button id="modeAll" class="btn" type="button">all</button>

          <button id="modeText" class="btn is-on" type="button" aria-pressed="true">text</button>
          <button id="modeAudio" class="btn is-on" type="button" aria-pressed="true">audio</button>
          <button id="modeVisual" class="btn is-on" type="button" aria-pressed="true">visual</button>

          <button id="themeToggle" class="btn" type="button" aria-label="toggle theme">⭘</button>
        </div>
      </div>
    </header>

    <section id="content" class="content" aria-live="polite"></section>
  </main>

  <script src="./assets/app.js"></script>
</body>
</html>

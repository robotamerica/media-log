<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>media log</title>

  <script>
  (function () {
    const p = new URLSearchParams(window.location.search);
    const t = (p.get("theme") || "").toLowerCase();
    if (t === "dark" || t === "light") {
      document.documentElement.setAttribute("data-theme", t);
      localStorage.setItem("media-log-theme", t);
    }
  })();
  </script>

  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand">
        <h1>media log</h1>
        <p class="desc">a small daily ledger of the media i consumed.</p>

        <div class="controls" role="group" aria-label="filters">
          <button id="modeWeek" class="btn is-on" type="button">latest</button>
          <button id="modeMonth" class="btn" type="button">month</button>

          <button id="weekPrev" class="btn" type="button" aria-label="newer week">◀</button>
          <button id="weekNext" class="btn" type="button" aria-label="older week">▶</button>

          <select id="monthSelect" class="sel hidden" aria-label="select month"></select>

          <button id="modeText" class="btn is-on" type="button" aria-pressed="true">text</button>
          <button id="modeAudio" class="btn is-on" type="button" aria-pressed="true">audio</button>
          <button id="modeVisual" class="btn is-on" type="button" aria-pressed="true">visual</button>

          <button id="themeToggle" class="btn" type="button" aria-label="toggle theme">⭘</button>
        </div>
      </div>
    </header>

    <section id="content" class="content" aria-live="polite"></section>
  </main>

  <script src="./assets/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>media log</title>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>media log</h1>
        <p class="desc">
          a small daily ledger of what i consumed — links grouped as reading | music | video.
          entries are stored as one json file per day in <code>data/</code>, plus a small date manifest.
        </p>
      </div>
      <div class="controls">
        <button id="modeLatest" class="btn is-on" type="button">latest</button>
        <button id="modeAll" class="btn" type="button">all</button>
      </div>
    </header>

    <section id="content" class="content" aria-live="polite"></section>

    <footer class="foot">
      <span>add entries with <code>./mlog.py</code> or by editing <code>data/YYYY-MM-DD.json</code></span>
    </footer>
  </main>

  <script src="./assets/app.js"></script>
</body>
</html>
